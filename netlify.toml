# Netlify hosts only the static site in web/. API calls go to the Flask backend.
[build]
  publish = "web"

# Replace YOUR-BACKEND-URL with your backend (e.g. https://<user>-krishivaani.hf.space)
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND-URL/api/:splat"
  status = 200
  force = true
