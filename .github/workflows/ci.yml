name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Backend tests
        run: python -m pytest -q

      - name: Front-end syntax check
        run: node --check web/main.js && node --check web/sw.js

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the Hugging Face image
        run: docker build -t krishivaani .
      - name: Start it and hit /healthz
        run: |
          docker run -d -p 7860:7860 --name kv krishivaani
          for i in $(seq 1 30); do curl -fs localhost:7860/healthz && exit 0; sleep 2; done
          docker logs kv; exit 1
